[package]
name = "secs-simulator"
version = "0.1.0"
description = "SECS/HSMS-SS dual-role simulator (Host/Equipment) powered by secs4rs"
authors = ["secs-simulator contributors"]
edition = "2021"
license = "Apache-2.0"

[lib]
name = "secs_simulator_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "2"
# Vendored package pin (C# NuGet/DLL style). Upgrade: ./scripts/vendor-secs4rs.sh
secs4rs = { path = "vendor/secs4rs", version = "0.1.0" }
roxmltree = "0.20"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
