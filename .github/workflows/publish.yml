name: publish

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin
          - platform: macos-latest
            args: --target x86_64-apple-darwin
          - platform: ubuntu-22.04
            args: ""
          - platform: windows-latest
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v5

      - name: install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils libssl-dev

      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - name: setup node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: prove updater key signs
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          KEY_LEN=$(printf '%s' "${TAURI_SIGNING_PRIVATE_KEY}" | wc -c | tr -d ' ')
          PASS_LEN=$(printf '%s' "${TAURI_SIGNING_PRIVATE_KEY_PASSWORD}" | wc -c | tr -d ' ')
          echo "key_chars=${KEY_LEN} pass_chars=${PASS_LEN} (key should be ~300+)"
          if [ "${KEY_LEN}" -lt 80 ]; then
            echo "TAURI_SIGNING_PRIVATE_KEY is missing or too short. Paste ALL of ~/.tauri/secs-simulator.key"
            exit 1
          fi
          if [ "${PASS_LEN}" -lt 1 ]; then
            echo "TAURI_SIGNING_PRIVATE_KEY_PASSWORD is empty. Value must be: updater"
            exit 1
          fi
          printf 'test' > dummy.bin
          pnpm tauri signer sign dummy.bin

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: "SECS Simulator v__VERSION__"
          releaseBody: "See the assets to download this version and install."
          releaseDraft: true
          prerelease: false
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true
          args: ${{ matrix.args }}
